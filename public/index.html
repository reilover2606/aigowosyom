<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aigowosyom</title>
<script src="/assets/theme.js"></script>
<script src="/assets/icons.js"></script>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/suggest.css">
<style>
    body {
        margin: 60px auto;
        max-width: 700px;
        padding: 0 20px;
        background: #f4f6f3;
        color: #222;
        text-align: center;
    }

    p {
        color: #666;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 40px;
    }

    .card {
        display: block;
        padding: 30px 20px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 5px #0001;
        color: inherit;
        text-decoration: none;
    }

    .card:hover {
        border-color: #4a7c59;
        box-shadow: 0 2px 8px #0003;
    }

    .card h2 {
        margin: 0 0 8px;
    }

    .card span {
        font-size: 0.9em;
        color: #666;
    }

    /* Site-wide search, under the cards */
    .site-search {
        position: relative;
        display: flex;
        gap: 8px;
        margin-top: 28px;
    }

    .site-search input {
        flex: 1;
        min-width: 0;
        padding: 10px 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        font-size: 16px;
        background: white;
    }

    .site-search button {
        padding: 10px 18px;
        border: 1px solid #4a7c59;
        border-radius: 6px;
        background: #4a7c59;
        color: white;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
    }

    .site-search button:hover {
        background: #3d6a4a;
    }

    /* The suggestion dropdown spans the search box. */
    .site-search .suggestions {
        left: 0;
        right: 0;
        width: auto;
        text-align: left;
    }
</style>
<link rel="stylesheet" href="/assets/themes/neumorph.css">
<link rel="stylesheet" href="/assets/themes/dark.css">
</head>
<body>

<nav class="sitebar sitebar-float" aria-label="Sections of the site">
    <a href="/calendar/">Calendar</a>
    <a href="/lore">Lore</a>
    <a href="/dictionary">Dictionary</a>
    <label class="theme-switch"><span>Theme</span><select id="themeSelect" aria-label="Theme"></select></label>
</nav>

<h1>Aigowosyom</h1>
<p>Worldbuilding data</p>

<div class="cards">
    <a class="card" href="/calendar">
        <h2>Calendar</h2>
        <span>Tanakōdeyam calendar, eras and day notes</span>
    </a>
    <a class="card" href="/lore">
        <h2>Lore</h2>
        <span>An encyclopedia of categories and pages</span>
    </a>
    <a class="card" href="/dictionary">
        <h2>Dictionary</h2>
        <span>Constructed languages: entries, search and editor</span>
    </a>
</div>

<form class="site-search" action="/search" method="get" role="search" data-suggest="site">
    <input type="search" name="q" placeholder="Search the dictionary, the lore and calendar notes" aria-label="Search the whole site">
    <button type="submit">Search</button>
</form>

<script src="/assets/dictionary/suggest.js"></script>
</body>
</html>
