<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aigowosyom</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
    body {
        margin: 60px auto;
        max-width: 700px;
        padding: 0 20px;
        background: #f4f6f3;
        color: #222;
        text-align: center;
    }

    p {
        color: #666;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 40px;
    }

    .card {
        display: block;
        padding: 30px 20px;
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 5px #0001;
        color: inherit;
        text-decoration: none;
    }

    .card:hover {
        border-color: #4a7c59;
        box-shadow: 0 2px 8px #0003;
    }

    .card h2 {
        margin: 0 0 8px;
    }

    .card span {
        font-size: 0.9em;
        color: #666;
    }
</style>
</head>
<body>

<h1>Aigowosyom</h1>
<p>Worldbuilding data</p>

<div class="cards">
    <a class="card" href="/calendar">
        <h2>Calendar</h2>
        <span>Tanakōdeyam calendar, eras and day notes</span>
    </a>
    <a class="card" href="/dictionary">
        <h2>Dictionary</h2>
        <span>Constructed languages: entries, search and editor</span>
    </a>
</div>

</body>
</html>
