
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanakōdeyam Yearly Calendar</title>
<link rel="stylesheet" href="/assets/site.css">

<style>
    body {
        margin: 30px auto;
        max-width: 1100px;
        padding: 0 20px;
        background: #f4f6f3;
        color: #222;
    }

    h1, h2 {
        text-align: center;
    }

    .home-link {
        margin: 0;
        font-size: 0.9em;
    }

    @media print {
        .home-link {
            display: none;
        }
    }

    .controls {
        text-align: center;
        margin: 25px 0;
    }

    input, button {
        padding: 8px 12px;
        font-size: 16px;
    }

    button {
        cursor: pointer;
    }

    #calendar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
    }

    .month {
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 5px #0001;
    }

    .month h2 {
        margin: 0 0 12px;
        font-size: 1.3em;
    }

    .month-info {
        text-align: center;
        font-size: 0.85em;
        color: #666;
        margin-bottom: 12px;
    }

    .week {
        margin-bottom: 12px;
        border-top: 1px solid #ddd;
        padding-top: 8px;
    }

    .week-label {
        font-size: 0.75em;
        color: #888;
        margin-bottom: 5px;
    }

    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        gap: 2px;
    }

    .weekday {
        font-size: 0.7em;
        color: #777;
        padding-bottom: 5px;
    }

    .day {
		min-height: 48px;
		padding: 5px 0;
		border-radius: 4px;
		background: #f5f5f5;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 2px;
	}

	.tanakodeyam-day {
		font-size: 1.15em;
		font-weight: bold;
		line-height: 1.2;
	}

	.gregorian-date {
		font-size: 0.7em;
		font-style: italic;
		color: #777;
		line-height: 1.2;
	}

    .empty {
        background: transparent;
    }

    .intercalary {
        background: #edf3e9;
    }

    .short-month {
        color: #888;
    }

    .legend {
        text-align: center;
        font-size: 0.85em;
        color: #666;
        margin: 20px 0;
    }

    @media print {
        body {
            background: white;
            margin: 0;
        }

        .controls, .legend {
            display: none;
        }

        #calendar {
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .month {
            box-shadow: none;
            break-inside: avoid;
            padding: 8px;
        }
    }
	
	#eraDisplay {
		text-align: center;
		margin: 20px 0;
	}

	.era-entry {
		font-size: 1.2em;
		font-weight: bold;
		margin: 5px 0;
	}

	.era-entry erayear {
		font-size: 1.5em;
		font-weight: normal;
		color: black;
	}
	
	/* Highlight today's Gregorian date */
	.day.today {
		background-color: #ffeb70;
		border: 2px solid #d4a900;
		box-sizing: border-box;
		color: #222;
	}

	.day.today .gregorian-date {
		color: #665000;
	}
	
	#eraTimeline {
		margin: 25px 0 15px;
		overflow-x: auto;
	}

	.timeline-bar {
		display: flex;
		width: 100%;
		min-width: 600px;
		height: 55px;
	}

	.era-segment {
		position: relative;
		height: 100%;
		box-sizing: border-box;
		border-right: 1px solid white;
		background: #b0dfff;
		cursor: pointer;
		transition: filter 0.15s;
		overflow: hidden;
	}

	.era-segment:hover {
		filter: brightness(0.88);
	}

	.era-segment-label {
		position: absolute;
		inset: 0;
		display: flex;
		align-items: center;
		justify-content: left;
		text-align: justify;
		padding: 3px;
		font-size: 0.8em;
		font-weight: bold;
		white-space: normal;
		letter-spacing: -0.75px;
	}

	.timeline-years {
		display: flex;
		justify-content: space-between;
		min-width: 600px;
		font-size: 0.75em;
		color: #666;
		margin-top: 4px;
	}

	/* Clickable days and note badges */
	.day[data-day] {
		position: relative;
		cursor: pointer;
	}

	.day[data-day]:hover {
		outline: 2px solid #8aa882;
	}

	.note-badge {
		position: absolute;
		top: 2px;
		right: 3px;
		min-width: 14px;
		padding: 0 3px;
		border-radius: 7px;
		background: #4a7c59;
		color: white;
		font-size: 0.65em;
		line-height: 14px;
	}

	/* Notes dialog */
	#notesDialog {
		width: min(560px, 92vw);
		max-height: 85vh;
		border: 1px solid #999;
		border-radius: 8px;
		padding: 20px;
	}

	#notesDialog::backdrop {
		background: #0006;
	}

	#notesDialog h2 {
		margin: 0 0 4px;
	}

	#notesDialogSub {
		text-align: center;
		color: #666;
		font-size: 0.9em;
		margin-bottom: 15px;
	}

	.note {
		border: 1px solid #ddd;
		border-radius: 6px;
		padding: 10px;
		margin-bottom: 10px;
		background: #fafafa;
	}

	.note-title {
		font-weight: bold;
		margin-bottom: 4px;
	}

	.note-body {
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}

	.note-actions {
		margin-top: 8px;
		display: flex;
		gap: 6px;
	}

	.note-actions button,
	.note-form button {
		font-size: 13px;
		padding: 4px 10px;
	}

	.note-form {
		display: flex;
		flex-direction: column;
		gap: 6px;
		margin-top: 10px;
	}

	.note-form input,
	.note-form textarea {
		font: inherit;
		font-size: 14px;
		padding: 6px 8px;
		box-sizing: border-box;
		width: 100%;
	}

	.note-form textarea {
		min-height: 90px;
		resize: vertical;
	}

	.note-form-buttons {
		display: flex;
		gap: 6px;
	}

	.notes-empty, .notes-error {
		text-align: center;
		color: #777;
		margin: 10px 0;
	}

	.notes-error {
		color: #a33;
	}

	.dialog-close {
		display: block;
		margin: 15px auto 0;
	}

	@media print {
		.note-badge {
			display: none;
		}
	}
</style>
</head>

<body>

<p class="home-link"><a href="/">← Home</a></p>

<h1>Tanakōdeyam</h1>

<div id="eraTimeline"></div>
<div id="eraDisplay"></div>

<div class="controls">
    <label for="yearInput">Universal year:</label>
    <input type="number" id="yearInput" value="2026" min="1">
    <button onclick="generateCalendar()">Jump</button>
    <button onclick="window.print()">Print</button>
</div>

<div id="calendar"></div>

<div class="legend">
    Monday-first weeks · Days outside the month are left blank · Click a day to view or add notes.
</div>

<dialog id="notesDialog">
    <h2 id="notesDialogTitle"></h2>
    <div id="notesDialogSub"></div>
    <div id="notesList"></div>
    <form id="noteForm" class="note-form">
        <input type="text" id="noteTitleInput" placeholder="Title (optional)" maxlength="200">
        <textarea id="noteBodyInput" placeholder="Note" required></textarea>
        <div class="note-form-buttons">
            <button type="submit" id="noteSubmit">Add note</button>
            <button type="button" id="noteCancelEdit" hidden>Cancel edit</button>
        </div>
    </form>
    <button type="button" class="dialog-close" id="notesDialogClose">Close</button>
</dialog>

<script>
// ======================================================
// ASTRONOMICAL PARAMETERS
// ======================================================

const TROPICAL_YEAR = 365.2422;
const SYNODIC_MONTH = 29.530588853;
const MS_PER_DAY = 86400000;

// Winter solstice at the beginning of calendar year 1.
// This is a simplified reference epoch.
const EPOCH_SOLSTICE = makeUTCDate(1, 12, 20);

// Reference new moon epoch.
// Replace with a known new moon if you want to calibrate
// the lunar cycle to a particular historical date.
const NEW_MOON_EPOCH = makeUTCDate(1, 12, 20);


// ======================================================
// MONTH NAMES
// ======================================================

const MONTHS = [
    "Hiūnmoin 虚月",
    "Wānmoin 一月",
    "Dhuōmoin 二月",
    "Sānemoin 三月",
    "Nōlmoin 四月",
    "Peiksemoin 五月",
    "Liāmoin 六月",
    "Newōsēpreya 不見神",
    "Khīnmoin 七月",
    "Okotōmoin 八月",
    "Kokonōmoin 九月",
    "Thēsemoin 十月",
    "Thōnamoin 十一月",
    "Elendāmoin 十二月"
];

const WEEKDAYS = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];

let eras = [];

// Last universal year that has an era. Later years have none.
const ERA_HORIZON_YEAR = 2049;

// Load eras from the external JSON file.
async function loadEraData() {
    try {
        const response = await fetch("eras.json");

        if (!response.ok) {
            throw new Error("Could not load eras.json");
        }

        eras = await response.json();

        // Ensure eras are sorted by starting year.
        eras.sort((a, b) => a.startYear - b.startYear);

        // /calendar/?year=2026 opens that year (used by links from the lore).
        const requestedYear = parseInt(new URLSearchParams(location.search).get("year"), 10);

        if (Number.isInteger(requestedYear) && requestedYear >= 1) {
            document.getElementById("yearInput").value = requestedYear;
        }

        generateCalendar();
    } catch (error) {
        console.error("Error loading era data:", error);

        document.getElementById("eraDisplay").textContent =
            "Could not load era data. Check eras.json.";
    }
}


// Return all eras that apply to a universal year.
//
// An era ends in the same universal year that the
// following era begins. Therefore, both endpoints
// are inclusive.

function getErasForYear(year) {
    const result = [];

    // Years after the era system's horizon have no era.
    if (year > ERA_HORIZON_YEAR) {
        return result;
    }

    for (let i = 0; i < eras.length; i++) {
        const era = eras[i];

        const nextEra = eras[i + 1];

        const startYear = era.startYear;

        const endYear = nextEra
            ? nextEra.startYear
            : Infinity;

        if (year >= startYear && year <= endYear) {
            result.push({
                name: era.name,
                eraYear: year - startYear + 1
            });
        }
    }

    return result;
}


function displayEraTimeline(year) {
    const container = document.getElementById("eraTimeline");
    container.innerHTML = "";

    if (eras.length === 0) {
        return;
    }

    /*
     * The timeline extends from the beginning of the
     * first era to the current universal year.
     *
     * If the selected year is later than the current
     * year, extend the timeline to the selected year.
     */
    const currentUniversalYear = new Date().getFullYear();

    const timelineEnd = Math.max(
        2049,
        year
    );

    const timelineStart = eras[0].startYear;

    // Don't draw anything if the requested range
    // doesn't overlap the era system.
    if (timelineEnd < timelineStart) {
        return;
    }

    const bar = document.createElement("div");
    bar.className = "timeline-bar";

    for (let i = 0; i < eras.length; i++) {
        const era = eras[i];

        // The next era begins where this era ends.
        // Because era boundaries overlap, the final
        // year belongs to both eras. For proportional
        // display, we treat the boundary as belonging
        // to the following era.
        const nextEra = eras[i + 1];

        let eraEnd;

        if (nextEra) {
            eraEnd = nextEra.startYear;
        } else {
            // The final era is represented only up to
            // the timeline's finite viewing horizon.
            eraEnd = timelineEnd + 1;
        }

        const eraStart = Math.max(
            era.startYear,
            timelineStart
        );

        const visibleEnd = Math.min(
            eraEnd,
            timelineEnd + 1
        );

        const duration = visibleEnd - eraStart;

        if (duration <= 0) {
            continue;
        }

        const segment = document.createElement("div");
        segment.className = "era-segment";

        /*
         * Width is proportional to the number of
         * universal years represented.
         */
        segment.style.flex = `${duration} 0 0`;

        const label = document.createElement("div");
        label.className = "era-segment-label conlang";
        label.textContent = era.name;

        segment.appendChild(label);

        /*
         * Clicking the era takes you approximately
         * to its beginning.
         */
        segment.addEventListener("click", (event) => {
			const rect = segment.getBoundingClientRect();

			const position =
				(event.clientX - rect.left) / rect.width;

			const clickedYear =
				Math.floor(
					eraStart +
					position * duration
				);

			document.getElementById("yearInput").value =
				Math.max(1, clickedYear);

			generateCalendar();

			window.scrollTo({
				top: 0,
				behavior: "smooth"
			});
		});

        segment.title =
            `${era.name}: Universal Year ${era.startYear}` +
            (nextEra
                ? `–${nextEra.startYear}`
                : "–present");

        bar.appendChild(segment);
    }

    container.appendChild(bar);

    /*
     * Add approximate universal-year markers.
     */
    const years = document.createElement("div");
    years.className = "timeline-years";

    const startLabel = document.createElement("span");
    startLabel.textContent = timelineStart;

    const endLabel = document.createElement("span");
    endLabel.textContent = timelineEnd;

    years.appendChild(startLabel);
    years.appendChild(endLabel);

    container.appendChild(years);
}


// Display the era names and era-year numbers.

function displayEraInfo(year) {
    const display = document.getElementById("eraDisplay");
    display.innerHTML = "";

    const matchingEras = getErasForYear(year);

    for (const era of matchingEras) {
        const entry = document.createElement("div");
        entry.className = "era-entry conlang";

        entry.textContent = era.name + " ";

        const yearLabel = document.createElement("erayear");
        yearLabel.textContent = era.eraYear;

        entry.appendChild(yearLabel);
        display.appendChild(entry);
    }
}


// ======================================================
// DATE HELPERS
// ======================================================

// JavaScript treats years 0-99 specially in Date.UTC.
// This helper avoids that behavior.

function makeUTCDate(year, month, day) {
    const date = new Date(0);
    date.setUTCHours(0, 0, 0, 0);
    date.setUTCFullYear(year, month - 1, day);
    return date.getTime();
}


// Start of the Tanakōdeyam year.
// Year 1 starts at the winter solstice of year 1.

function winterSolstice(year) {
    return EPOCH_SOLSTICE +
        (year - 1) * TROPICAL_YEAR * MS_PER_DAY;
}


// Approximate summer solstice.

function summerSolstice(year) {
    return winterSolstice(year) +
        (TROPICAL_YEAR / 2) * MS_PER_DAY;
}


// Find the first mean new moon strictly after a date.

function nextNewMoon(instant) {
    const elapsed =
        (instant - NEW_MOON_EPOCH) / MS_PER_DAY;

    const n = Math.floor(elapsed / SYNODIC_MONTH) + 1;

    return NEW_MOON_EPOCH +
        n * SYNODIC_MONTH * MS_PER_DAY;
}


// ======================================================
// BUILD THE CALENDAR
// ======================================================

function buildYear(year) {
    const winter = winterSolstice(year);
    const summer = summerSolstice(year);
    const nextWinter = winterSolstice(year + 1);

    const months = [];

    // First intercalary period:
    // Winter solstice to first new moon after it.

    let start = winter;
    let newMoon = nextNewMoon(winter);

    months.push({
        name: MONTHS[0],
        start: start,
        end: newMoon,
        intercalary: true
    });

    // Months 1-5.
    // Month 6 is cut off at the summer solstice.

    start = newMoon;

    for (let i = 1; i <= 6; i++) {
        let end;

        if (i === 6) {
            end = summer;
        } else {
            end = start + SYNODIC_MONTH * MS_PER_DAY;
        }

        months.push({
            name: MONTHS[i],
            start: start,
            end: end,
            intercalary: false
        });

        start = end;
    }

    // Second intercalary period:
    // Summer solstice to first new moon after it.

    newMoon = nextNewMoon(summer);

    months.push({
        name: MONTHS[7],
        start: summer,
        end: newMoon,
        intercalary: true
    });

    // Months 7-11.
    // Month 12 is cut off at the next winter solstice.

    start = newMoon;

    for (let i = 8; i <= 13; i++) {
        let end;

        if (i === 13) {
            end = nextWinter;
        } else {
            end = start + SYNODIC_MONTH * MS_PER_DAY;
        }

        months.push({
            name: MONTHS[i],
            start: start,
            end: end,
            intercalary: false
        });

        start = end;
    }

    return months;
}


// ======================================================
// CIVIL DATE HELPERS
// ======================================================

// Calendar intervals are half-open: [start, end).
// A day belongs to the interval if its UTC day begins
// before the interval end and at or after its start.

function firstCivilDay(instant) {
    return Math.ceil(instant / MS_PER_DAY);
}

function lastCivilDay(instant) {
    return Math.ceil(instant / MS_PER_DAY) - 1;
}

function dateFromDayNumber(dayNumber) {
    return new Date(dayNumber * MS_PER_DAY);
}

function formatDate(dayNumber) {
    const d = dateFromDayNumber(dayNumber);

    const year = d.getUTCFullYear();
    const month = String(d.getUTCMonth() + 1).padStart(2, "0");
    const day = String(d.getUTCDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


// ======================================================
// WEEKDAY CALCULATION
// ======================================================

// Year 1, Hiūnmoin 1 is Monday.
// The civil day number of that date is our weekday epoch.

const WEEKDAY_EPOCH = firstCivilDay(EPOCH_SOLSTICE);

function weekdayIndex(dayNumber) {
    return ((dayNumber - WEEKDAY_EPOCH) % 7 + 7) % 7;
}


// ======================================================
// RENDER THE CALENDAR
// ======================================================

function generateCalendar() {
    const year = parseInt(
        document.getElementById("yearInput").value,
        10
    );

    const container = document.getElementById("calendar");
    container.innerHTML = "";

    if (!Number.isInteger(year) || year < 1) {
        container.textContent = "Please enter a valid year.";
        return;
    }
	
	// Get today's date in the user's local time zone.
	const today = new Date();

	const todayGregorianYear = today.getFullYear();
	const todayMonth = today.getMonth() + 1;
	const todayDay = today.getDate();
	
	displayEraInfo(year);
	displayEraTimeline(year);

    const months = buildYear(year);

    for (const month of months) {
        const firstDay = firstCivilDay(month.start);
        const lastDay = lastCivilDay(month.end);

        // Number of civil days displayed in this month.
        const dayCount = lastDay - firstDay + 1;

        const monthDiv = document.createElement("div");
        monthDiv.className = "month";

        const heading = document.createElement("h2");
        heading.className = "conlang";
        heading.textContent = month.name;
        monthDiv.appendChild(heading);

        const info = document.createElement("div");
        info.className = "month-info";

        if (dayCount > 0) {
            info.textContent =
                `${formatDate(firstDay)} – ${formatDate(lastDay)} · ` +
                `${dayCount} days`;
        } else {
            info.textContent = "No civil days";
        }

        monthDiv.appendChild(info);

        // Weekday headings.
        const weekdayRow = document.createElement("div");
        weekdayRow.className = "days";

        for (const weekday of WEEKDAYS) {
            const label = document.createElement("div");
            label.className = "weekday";
            label.textContent = weekday.slice(0, 2);
            label.title = weekday;
            weekdayRow.appendChild(label);
        }

        monthDiv.appendChild(weekdayRow);

        // Group days into Monday-Sunday weeks.
        // Weeks are displayed separately within each month.

        let currentDay = firstDay;
        let weekNumber = 1;

        while (currentDay <= lastDay) {
            const weekDiv = document.createElement("div");
            weekDiv.className = "week";

            const weekLabel = document.createElement("div");
            weekLabel.className = "week-label";
            weekLabel.textContent = `Week ${weekNumber}`;
            weekDiv.appendChild(weekLabel);

            const daysDiv = document.createElement("div");
            daysDiv.className = "days";

            // Find the weekday of the first day in this week.
            const firstWeekday = weekdayIndex(currentDay);

            // Blank cells before the first day of the week.
            for (let i = 0; i < firstWeekday; i++) {
                const blank = document.createElement("div");
                blank.className = "day empty";
                daysDiv.appendChild(blank);
            }

            // Fill this week with dates, Monday through Sunday.
            for (
                let i = firstWeekday;
                i < 7 && currentDay <= lastDay;
                i++
            ) {
                const dayDiv = document.createElement("div");
                dayDiv.className = "day";
                dayDiv.dataset.day = currentDay;
                dayDiv.dataset.monthName = month.name;
                dayDiv.dataset.dayInMonth = currentDay - firstDay + 1;

                const date = dateFromDayNumber(currentDay);
				
				// Check whether this Gregorian date is today.
				if (
					date.getUTCFullYear() === todayGregorianYear &&
					date.getUTCMonth() + 1 === todayMonth &&
					date.getUTCDate() === todayDay
				) {
					dayDiv.classList.add("today");
				}

                // Tanakōdeyam day number (1-based within the month).
				const tanakodeyamDay = currentDay - firstDay + 1;

				const tanakodeyamLabel = document.createElement("div");
				tanakodeyamLabel.className = "tanakodeyam-day";
				tanakodeyamLabel.textContent = tanakodeyamDay;

				// Gregorian month-day, e.g. 3-14.
				const gregorianLabel = document.createElement("div");
				gregorianLabel.className = "gregorian-date";
				gregorianLabel.textContent =
					`${date.getUTCMonth() + 1}-${date.getUTCDate()}`;

				// Add both labels to the day square.
				dayDiv.appendChild(tanakodeyamLabel);
				dayDiv.appendChild(gregorianLabel);

				// Full date and weekday on hover.
				dayDiv.title =
					`${WEEKDAYS[weekdayIndex(currentDay)]}, ` +
					formatDate(currentDay);

                if (month.intercalary) {
                    dayDiv.classList.add("intercalary");
                }

                daysDiv.appendChild(dayDiv);
                currentDay++;
            }

            // Blank cells after the last day of the week.
            const filledCells = daysDiv.children.length;

            for (let i = filledCells; i < 7; i++) {
                const blank = document.createElement("div");
                blank.className = "day empty";
                daysDiv.appendChild(blank);
            }

            weekDiv.appendChild(daysDiv);
            monthDiv.appendChild(weekDiv);

            weekNumber++;
        }

        if (dayCount <= 0) {
            monthDiv.classList.add("short-month");
        }

        container.appendChild(monthDiv);
    }

    // Show note counts for every day in this year.
    loadNoteCounts(
        firstCivilDay(months[0].start),
        lastCivilDay(months[months.length - 1].end)
    );
}


// ======================================================
// NOTES
// ======================================================

const notesDialog = document.getElementById("notesDialog");
const notesList = document.getElementById("notesList");
const noteForm = document.getElementById("noteForm");
const noteTitleInput = document.getElementById("noteTitleInput");
const noteBodyInput = document.getElementById("noteBodyInput");
const noteSubmit = document.getElementById("noteSubmit");
const noteCancelEdit = document.getElementById("noteCancelEdit");

let activeDay = null;      // civil day number open in the dialog
let editingNoteId = null;  // note being edited, or null when adding
let countsRequest = 0;     // guards against out-of-order responses

async function api(method, url, data) {
    const options = { method, headers: {} };

    if (data !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(data);
    }

    const response = await fetch(url, options);
    const payload = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(payload.error || `Request failed (${response.status})`);
    }

    return payload;
}

function dayCell(day) {
    return document.querySelector(`.day[data-day="${day}"]`);
}

function setBadge(day, count) {
    const cell = dayCell(day);

    if (!cell) {
        return;
    }

    let badge = cell.querySelector(".note-badge");

    if (count <= 0) {
        if (badge) {
            badge.remove();
        }
        return;
    }

    if (!badge) {
        badge = document.createElement("span");
        badge.className = "note-badge";
        cell.appendChild(badge);
    }

    badge.textContent = count;
}

async function loadNoteCounts(fromDay, toDay) {
    const request = ++countsRequest;

    try {
        const counts = await api(
            "GET",
            `/api/notes/counts?from=${fromDay}&to=${toDay}`
        );

        // A newer calendar render has superseded this one.
        if (request !== countsRequest) {
            return;
        }

        for (const [day, count] of Object.entries(counts)) {
            setBadge(day, count);
        }
    } catch (error) {
        console.error("Could not load note counts:", error);
    }
}

function resetNoteForm() {
    editingNoteId = null;
    noteTitleInput.value = "";
    noteBodyInput.value = "";
    noteSubmit.textContent = "Add note";
    noteCancelEdit.hidden = true;
}

function renderNotes(notes) {
    notesList.innerHTML = "";

    if (notes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "notes-empty";
        empty.textContent = "No notes for this day yet.";
        notesList.appendChild(empty);
        return;
    }

    for (const note of notes) {
        const div = document.createElement("div");
        div.className = "note";

        if (note.title) {
            const title = document.createElement("div");
            title.className = "note-title";
            title.textContent = note.title;
            div.appendChild(title);
        }

        const body = document.createElement("div");
        body.className = "note-body";
        body.textContent = note.body;
        div.appendChild(body);

        const actions = document.createElement("div");
        actions.className = "note-actions";

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => {
            editingNoteId = note.id;
            noteTitleInput.value = note.title || "";
            noteBodyInput.value = note.body;
            noteSubmit.textContent = "Save changes";
            noteCancelEdit.hidden = false;
            noteBodyInput.focus();
        });

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", async () => {
            if (!confirm("Delete this note?")) {
                return;
            }

            try {
                await api("DELETE", `/api/notes/${note.id}`);

                if (editingNoteId === note.id) {
                    resetNoteForm();
                }

                await refreshNotes();
            } catch (error) {
                showNotesError(error);
            }
        });

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);
        div.appendChild(actions);

        notesList.appendChild(div);
    }
}

function showNotesError(error) {
    const message = document.createElement("div");
    message.className = "notes-error";
    message.textContent = error.message;
    notesList.prepend(message);
}

// Reload the open day's notes and update its badge.
async function refreshNotes() {
    const day = activeDay;
    const notes = await api("GET", `/api/notes?day=${day}`);

    if (day !== activeDay) {
        return;
    }

    renderNotes(notes);
    setBadge(day, notes.length);
}

async function openNotes(cell) {
    activeDay = Number(cell.dataset.day);
    resetNoteForm();

    const year = document.getElementById("yearInput").value;
    const weekday = WEEKDAYS[weekdayIndex(activeDay)];

    document.getElementById("notesDialogTitle").textContent =
        `${cell.dataset.monthName} ${cell.dataset.dayInMonth}`;
    document.getElementById("notesDialogSub").textContent =
        `Year ${year} · ${weekday}, ${formatDate(activeDay)}`;

    notesList.textContent = "Loading…";
    notesDialog.showModal();

    try {
        await refreshNotes();
    } catch (error) {
        notesList.textContent = "";
        showNotesError(error);
    }
}

noteForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const data = {
        title: noteTitleInput.value,
        body: noteBodyInput.value
    };

    try {
        if (editingNoteId === null) {
            await api("POST", "/api/notes", { day: activeDay, ...data });
        } else {
            await api("PUT", `/api/notes/${editingNoteId}`, data);
        }

        resetNoteForm();
        await refreshNotes();
    } catch (error) {
        showNotesError(error);
    }
});

noteCancelEdit.addEventListener("click", resetNoteForm);

document.getElementById("notesDialogClose").addEventListener(
    "click",
    () => notesDialog.close()
);

// Close when clicking the backdrop.
notesDialog.addEventListener("click", (event) => {
    if (event.target === notesDialog) {
        notesDialog.close();
    }
});

notesDialog.addEventListener("close", () => {
    activeDay = null;
});

// Delegated click handler for all day cells.
document.getElementById("calendar").addEventListener("click", (event) => {
    const cell = event.target.closest(".day[data-day]");

    if (cell) {
        openNotes(cell);
    }
});


// Generate the initial calendar on page load.
loadEraData();

</script>
